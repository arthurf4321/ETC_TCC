<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
    <link rel="stylesheet" href="../CSS/cadastro.css?v=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="../JS/cadastroController.js" defer></script>
</head>
<body> 
    <div class="container">
        <fieldset class="animate__animated animate__fadeInRight">
            <legend><h1>Cadastro</h1></legend>

            <form action="../php/auth/cadastro.php" method="POST" id="formCadastro"> 
                <div class="input-container">
                    <i class="fas fa-user"></i>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="input-container">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="Digite seu email completo" required>
                </div>

                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <div class="input-container">
                    <i class="fas fa-briefcase"></i>
                    <select id="cargo" name="cargo">
                        <option value="caixa">Caixa</option>
                        <option value="preparador">Preparador</option>
                        <option value="gerente">Gerente</option>
                    </select>
                </div>

                <input type="submit" class="btn-cadastro" id="buttonCadastro" value="Cadastrar-se">
                <a href="../php/pages/home.php">Voltar</a>
            </form>
        </fieldset>  

        <fieldset class="social-login animate__animated animate__fadeInRight">
            <legend><h2>Ou entre com</h2></legend>
            <button class="social-btn google-btn">
                <i class="fab fa-google"></i> Google
            </button>
            <button class="social-btn github-btn">
                <i class="fab fa-github"></i> GitHub
            </button>
            <button class="social-btn linkedin-btn">
                <i class="fab fa-linkedin"></i> LinkedIn
            </button>
        </fieldset>  
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fieldset = document.querySelector('fieldset');
            fieldset.classList.add('animate__fadeInRight');
        });
    </script>
</body>
</html>
