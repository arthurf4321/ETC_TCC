<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
    <link rel="stylesheet" href="../CSS/cadastro.css?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="../JS/cadastroController.js" defer></script>
</head>
<body> 
    <div class="form-container animate__animated animate__fadeInRight">
        <h1 class="form-title"><i class="fas fa-user-plus"></i> Cadastro</h1>

        <form action="../php/auth/cadastro.php" method="POST" id="formCadastro">
            <div class="form-group">
                <label for="nome"><i class="fas fa-user"></i> Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>
            </div>

            <div class="form-group">
                <label for="senha"><i class="fas fa-lock"></i> Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" required>
                <small class="password-hint">Mínimo 8 caracteres</small>
            </div>

            <div class="form-group">
                <label for="cargo"><i class="fas fa-briefcase"></i> Cargo</label>
                <select id="cargo" name="cargo" required>
                    <option value="" disabled selected>Selecione seu cargo</option>
                    <option value="caixa">Caixa</option>
                    <option value="preparador">Preparador</option>
                    <option value="gerente">Gerente</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-user-plus"></i> Cadastrar-se
            </button>

            <div class="form-footer">
                <a href="../php/pages/home.php"><i class="fas fa-arrow-left"></i> Voltar</a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const formContainer = document.querySelector('.form-container');
            formContainer.classList.add('animate__fadeInRight');
        });
    </script>
</body>
</html>
