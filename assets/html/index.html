<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="../imgs/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
    <link rel="stylesheet" href="../CSS/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/> 
    <script src="../JS/loginController.js" defer></script>
</head>
<body>
    <fieldset class="animate__animated animate__fadeInRight"> 
        <legend><h1>Login</h1></legend>

        <form id="formLogin" method="POST">
            <i class="fas fa-envelope"></i>
            <label>Email</label><br>
            <input type="email" id="email" name="email" placeholder="Digite seu Email" required><br><br>

            <i class="fas fa-lock"></i>
            <label>Senha</label><br>
            <input type="password" id="senha" name="senha" placeholder="Digite sua Senha" required><br><br>
            
            <input type="submit" value="Entrar" id="buttonEntrar" class="btn-login"><br>
        </form>
    </fieldset>    

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fieldset = document.querySelector('fieldset');
            fieldset.classList.add('animate__fadeInRight');
        });
    </script>
</body>
</html>
